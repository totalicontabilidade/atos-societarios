<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes — Atos Societários</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--navy:#14293f;--ok:#177245;--err:#b3261e;--warn:#8a6d00;--line:#dcdfe4;--muted:#5b6470}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:#1b1f24;background:#f6f7f9}
  header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{padding:18px;max-width:1000px;margin:0 auto}
  .placar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-weight:600}
  .placar .ok{color:var(--ok)} .placar .err{color:var(--err)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#eef1f5;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  td.res{white-space:nowrap;font-weight:700}
  .PASSOU{color:var(--ok)} .FALHOU{color:var(--err)} .PULADO{color:var(--warn)}
  .grupo td{background:#f0f3f7;font-weight:700;color:var(--navy)}
  .det{color:var(--muted);font-size:12.5px}
  iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:16px}
  .hint{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Testes automatizados — Atos Societários</h1>
  <button class="btn p" id="btnRodar">▶ Rodar tudo</button>
  <span class="hint" id="tempo"></span>
</header>
<main>
  <p class="hint">Roda o app dentro de um quadro isolado e confere os pontos que já quebraram alguma vez.
  Use <b>antes de publicar</b>: verde em tudo, pode subir. Nada aqui altera seus dados — o app de testes usa um armazenamento próprio.</p>
  <div class="placar" id="placar"></div>
  <table><thead><tr><th style="width:22%">Grupo</th><th style="width:40%">Teste</th><th style="width:10%">Resultado</th><th>Detalhe</th></tr></thead><tbody id="tbody"></tbody></table>
  <iframe id="alvo" src="index.html?teste=1" title="App em teste"></iframe>
</main>
<script>
(function(){
  var linhas=[], grupoAtual="", t0=0;
  var tbody=document.getElementById("tbody"), placar=document.getElementById("placar");

  function grupo(nome){ grupoAtual=nome; var tr=document.createElement("tr"); tr.className="grupo";
    tr.innerHTML='<td colspan="4">'+esc(nome)+'</td>'; tbody.appendChild(tr); }
  function reg(nome,ok,det){ linhas.push({ok:ok}); var tr=document.createElement("tr");
    var r = ok===null ? "PULADO" : (ok?"PASSOU":"FALHOU");
    tr.innerHTML='<td class="det">'+esc(grupoAtual)+'</td><td>'+esc(nome)+'</td><td class="res '+r+'">'+r+'</td><td class="det">'+esc(det||"")+'</td>';
    tbody.appendChild(tr); atualizaPlacar(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function atualizaPlacar(){
    var p=linhas.filter(function(l){return l.ok===true;}).length,
        f=linhas.filter(function(l){return l.ok===false;}).length,
        s=linhas.filter(function(l){return l.ok===null;}).length;
    placar.innerHTML='<span class="ok">'+p+' passaram</span>'+(f?'<span class="err">'+f+' FALHARAM</span>':'<span>0 falharam</span>')+(s?'<span>'+s+' pulados</span>':'');
  }
  function espera(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function ate(cond,limite){ limite=limite||15000; var ini=Date.now();
    return new Promise(function(res,rej){ (function tenta(){
      var v; try{ v=cond(); }catch(e){ v=false; }
      if(v) return res(v);
      if(Date.now()-ini>limite) return rej(new Error("tempo esgotado"));
      setTimeout(tenta,120); })(); }); }

  async function rodar(){
    tbody.innerHTML=""; linhas=[]; t0=Date.now();
    document.getElementById("btnRodar").disabled=true;
    var fr=document.getElementById("alvo");
    // recarrega o app do zero para cada execução
    fr.src="index.html?teste="+Date.now();
    var W,D;
    try{
      await new Promise(function(r){ fr.onload=r; });
      W=fr.contentWindow; D=fr.contentDocument;
      await ate(function(){ return W.TINA && D.getElementById("btnGerar"); });
    }catch(e){ grupo("Carregamento"); reg("App carrega no quadro de teste",false,String(e.message||e)); fim(); return; }

    var $=function(id){ return D.getElementById(id); };
    var modo=function(m){ var el=D.querySelector('[data-mode="'+m+'"]'); if(el) el.click(); };
    var val=function(id,v){ var e=$(id); if(e){ e.value=v; e.dispatchEvent(new W.Event("input",{bubbles:true})); } };
    var mark=function(id,v){ var e=$(id); if(e){ e.checked=v!==false; e.dispatchEvent(new W.Event("change",{bubbles:true})); } };
    var texto=function(){ var t=""; D.querySelectorAll("section.docxprev").forEach(function(c){ t+=(c.innerText||""); }); return t; };

    // ---------- 1. Carregamento ----------
    grupo("Carregamento");
    reg("Bibliotecas carregadas", !!(W.docxLib && W.JSZip && W.pdfMake), "docx/jszip/pdfmake");
    try{ await W.__pdfjsReady; }catch(e){}
    reg("pdf.js disponível e sem a versão vulnerável", !!(W.pdfjsLib && W.pdfjsLib.version && parseInt(W.pdfjsLib.version,10)>=4), "versão "+((W.pdfjsLib&&W.pdfjsLib.version)||"?"));
    reg("Nenhum rótulo apontando para campo inexistente",
        [].slice.call(D.querySelectorAll("label[for]")).filter(function(l){ return !D.getElementById(l.getAttribute("for")); }).length===0);
    var ids={},dup=[]; D.querySelectorAll("[id]").forEach(function(e){ ids[e.id]=(ids[e.id]||0)+1; if(ids[e.id]===2)dup.push(e.id); });
    reg("Sem identificadores duplicados", dup.length===0, dup.join(", "));

    // ---------- 2. Documentos ----------
    grupo("Documentos");
    var MODOS=["const","alt","ei_const","ei_alt","transf_ei_ltda","transf_ei_slu","transf_ltda_ei","dist_ltda","dist_ei"];
    for(var i=0;i<MODOS.length;i++){
      var m=MODOS[i];
      modo(m); await espera(140);
      $("btnExemplo").click(); await espera(240);
      try{
        await W.TINA.gerarPreview();
        await ate(function(){ return texto().length>800; }, 12000);
      }catch(e){ reg("Gera o documento — "+m,false,String(e.message||e)); continue; }
      var t=texto();
      var lixo=/undefined|NaN|\[object/.test(t);
      var place=/\[(?:NOME|RAZÃO|CNPJ|NIRE|OBJETO|TITULAR|FORO|DATA|ADMINISTRADOR|CIDADE)/.test(t);
      reg("Gera o documento — "+m, t.length>800 && !lixo && !place,
          t.length+" caracteres"+(lixo?" · contém undefined/NaN":"")+(place?" · sobrou campo entre colchetes":""));
    }

    // ---------- 3. Rótulo do quadro por tipo ----------
    grupo("Modos");
    var esperado={const:"Sócio",alt:"Sócio",ei_const:"Titular",ei_alt:"Titular",dist_ei:"Titular",transf_ltda_ei:"Titular"};
    for(var k in esperado){
      modo(k); await espera(160);
      var tag=(D.querySelector(".socio:not(.filial) .tag")||{}).textContent||"";
      reg("Quadro rotulado corretamente — "+k, tag.indexOf(esperado[k])>=0, "mostrou “"+tag+"”");
    }

    // ---------- 4. Limpeza (dado de um cliente não pode sobrar para o próximo) ----------
    grupo("Privacidade");
    modo("alt"); await espera(160);
    $("btnExemplo").click(); await espera(260);
    mark("alt_cessao"); val("cedNome","Fulano Cedente"); val("cessNome","Beltrano Cessionario"); val("cedQuotas","10");
    mark("admNaoSocio"); val("admnsNome","Adm Teste"); val("admnsQualif","brasileiro");
    mark("cl_conselho"); mark("cl_regencia"); mark("cl_exclusao");
    if($("btnAddFilial")){ $("btnAddFilial").click(); await espera(180);
      var f=D.querySelector(".filial"); if(f){ var lg=f.querySelector('[data-g="log"]'); if(lg) lg.value="Rua Filial"; } }
    $("btnEmail").click(); await espera(420);
    val("emailContato","CONTATO DO CLIENTE ANTERIOR");
    $("btnEmailClose").click(); await espera(180);
    var oc=W.confirm; W.confirm=function(){ return true; };
    $("btnLimpar").click(); await espera(600);
    W.confirm=oc;
    var sobrou=[];
    ["razao","objeto","capital","cedNome","cessNome","cedQuotas","admnsNome","admnsQualif","emailContato","emailCorpo","gateContato","gateData"]
      .forEach(function(id){ var e=$(id); if(e && (e.value||"").trim()) sobrou.push(id); });
    ["alt_cessao","admNaoSocio","cl_conselho","cl_regencia","cl_exclusao"].forEach(function(id){ var e=$(id); if(e&&e.checked) sobrou.push(id); });
    if(D.querySelectorAll(".filial").length) sobrou.push("filiais");
    reg("“Limpar” zera todos os campos, inclusive e-mail e filiais", sobrou.length===0, sobrou.length?("sobrou: "+sobrou.join(", ")):"nada sobrou");

    // ---------- 5. Portão de confirmação ----------
    grupo("Portão de confirmação");
    modo("alt"); await espera(160);
    $("btnExemplo").click(); await espera(260);
    $("btnBaixar").click(); await espera(500);
    var travou=$("gateModal").classList.contains("open");
    reg("Bloqueia o download sem a confirmação do cliente", travou);
    if(travou){
      val("gateData","13/08/2026"); val("gateContato","Contato"); val("gateNota","De acordo");
      $("btnGateRegistrar").click(); await espera(700);
      reg("Libera após registrar a confirmação", !$("gateModal").classList.contains("open"));
      // acrescentar cláusula depois de confirmado tem de vencer a confirmação
      mark("alt_cessao"); val("cedNome","Fulano"); val("cessNome","Beltrano"); val("cedQuotas","5");
      $("btnBaixar").click(); await espera(700);
      var venceu=$("gateModal").classList.contains("open");
      reg("Confirmação vence ao acrescentar cláusula depois", venceu, venceu?"portão reabriu":"LIBEROU sem reconfirmar");
      $("gateModal").classList.remove("open");
    } else { reg("Libera após registrar a confirmação",null,"pulado"); reg("Confirmação vence ao acrescentar cláusula depois",null,"pulado"); }

    // ---------- 6. Parsers ----------
    grupo("Preenchimento rápido");
    modo("alt"); await espera(160);
    val("cmdRapido","endereço para Rua das Flores, 120, Centro, Aracaju/SE, 49000-000");
    $("btnRapido").click(); await espera(1200);
    reg("Endereço: separa logradouro, número, bairro, município e UF",
        $("s_log").value==="Rua das Flores" && $("s_num").value==="120" && $("s_bairro").value==="Centro" && $("s_mun").value==="Aracaju" && $("s_uf").value==="SE",
        [$("s_log").value,$("s_num").value,$("s_bairro").value,$("s_mun").value,$("s_uf").value].join(" · "));
    val("cmdRapido","razão para NOVA EMPRESA MODELO; fantasia para LOJA MODELO; porte para EPP");
    $("btnRapido").click(); await espera(1000);
    reg("Comandos de razão, fantasia e porte",
        $("razao").value==="NOVA EMPRESA MODELO" && $("fantasia").value==="LOJA MODELO" && $("enquadramento").value==="EPP",
        [$("razao").value,$("fantasia").value,$("enquadramento").value].join(" · "));
    var V=W.TINA._u.validaCNPJ;
    reg("CNPJ numérico continua validando", V("12.345.678/0001-95")===true && V("12.345.678/0001-90")===false);
    reg("CNPJ alfanumérico aceito (IN RFB 2.229/2024)", V("12.ABC.345/01DE-35")===true && V("12.ABC.345/01DE-00")===false);
    reg("CPF validado", W.TINA._u.validaCPF("111.444.777-35")===true && W.TINA._u.validaCPF("111.444.777-00")===false);

    // ---------- 7. Segurança ----------
    grupo("Segurança");
    W.__xss=0;
    var P='<img src=x onerror="window.__xss=1">';
    modo("alt"); await espera(160);
    $("btnExemplo").click(); await espera(260);
    val("razao",P); val("objeto",P); val("fantasia",P);
    mark("alt_cessao"); val("cedNome",P); val("cessNome",P); val("cedQuotas","3");
    mark("admNaoSocio"); val("admnsNome",P); val("admnsQualif",P);
    try{ await W.TINA.gerarPreview(); }catch(e){}
    await espera(900);
    reg("Código injetado nos campos não executa na prévia", !W.__xss && D.querySelectorAll("section.docxprev img").length===0);
    $("btnPainel").click(); await espera(300);
    $("btnSalvarCaso").click(); await espera(500);
    reg("Código injetado não executa no painel de casos", !W.__xss && D.querySelectorAll("#painelLista img").length===0);
    if($("btnPainelClose")) $("btnPainelClose").click();
    // backup malicioso
    try{
      var mau=[{id:"BAD",empresa:"x"},{id:"20260101-0001",empresa:{a:1},data:"lixo",confirmado:true,confirmadoEm:P,confirmadoVia:"hack"},"txt",7,null];
      var blob=new W.Blob([JSON.stringify(mau)],{type:"application/json"});
      var dt=new W.DataTransfer(); dt.items.add(new W.File([blob],"b.json",{type:"application/json"}));
      var inp=$("fileImportCasos"); inp.files=dt.files; inp.dispatchEvent(new W.Event("change",{bubbles:true}));
      await espera(700);
      var casos=[]; try{ casos=JSON.parse(W.localStorage.getItem("tinaCasos")||"[]"); }catch(e){}
      var mal=casos.filter(function(c){ return c.id==="BAD" || typeof c.empresa!=="string" || (c.confirmadoEm||"").indexOf("<")>=0; });
      reg("Backup adulterado é saneado na importação", !W.__xss && mal.length===0, casos.length+" caso(s) após importar");
    }catch(e){ reg("Backup adulterado é saneado na importação",null,String(e.message||e)); }

    // ---------- 8. Licença ----------
    grupo("Licença");
    var LIC_BOA="eyJwYXJhIjoiVG90YWxpIFNvbHXDp8O1ZXMgQ29udMOhYmVpcyIsImVtIjoiMjAyNi0wOC0xMyJ9.9PYS3TQpIposkS8vgYNuhB3d9ov2xsGU7m7ZcmWpXBRg91IEgH08k5YZhiYUbzowZJ3MzizH74P8yD_XkUMOUw";
    var LIC_VENCIDA="eyJwYXJhIjoiQ2xpZW50ZSBUZXN0ZSIsImV4cCI6IjIwMjAtMDEtMDEiLCJlbSI6IjIwMTktMTItMDEifQ.pay1m-RFXhkT5s5jIdQVy6KgsaxbHFbtTZLuGHzEPEkoYnqgpkvGBR1Js86IvpG9rlcu-wx0t-AcxQ-apKE0ew";
    try{
      // avaliação vencida e sem licença: download tem de ficar bloqueado, prévia tem de continuar livre
      W.localStorage.setItem("tinaIni","2020-01-01"); W.localStorage.removeItem("tinaLic");
      fr.src="index.html?teste="+Date.now();
      await new Promise(function(r){ fr.onload=r; });
      W=fr.contentWindow; D=fr.contentDocument;
      await ate(function(){ return W.TINA && D.getElementById("btnGerar"); });
      $=function(id){ return D.getElementById(id); };
      D.querySelector('[data-mode="alt"]').click(); await espera(180);
      $("btnExemplo").click(); await espera(280);
      await W.TINA.gerarPreview(); await espera(700);
      var tp=""; D.querySelectorAll("section.docxprev").forEach(function(c){ tp+=(c.innerText||""); });
      reg("Sem licença: a prévia continua funcionando", tp.length>800, tp.length+" caracteres");
      $("btnBaixar").click(); await espera(700);
      reg("Sem licença: o download é bloqueado", !$("gateModal").classList.contains("open") && $("configModal").classList.contains("open"));
      // chave adulterada não pode valer
      var cl=$("cfgLicenca"); var partes=LIC_BOA.split(".");
      cl.value=partes[0]+"."+partes[1].slice(0,-4)+"AAAA"; cl.dispatchEvent(new W.Event("input",{bubbles:true}));
      await espera(800);
      reg("Chave com assinatura adulterada é recusada", ($("licStatus").innerText||"").indexOf("Licenciado")<0, $("licStatus").innerText.slice(0,60));
      cl.value=LIC_VENCIDA; cl.dispatchEvent(new W.Event("input",{bubbles:true})); await espera(800);
      reg("Chave vencida é recusada", ($("licStatus").innerText||"").indexOf("Licenciado")<0);
      cl.value=LIC_BOA; cl.dispatchEvent(new W.Event("input",{bubbles:true})); await espera(800);
      reg("Chave válida libera a geração", ($("licStatus").innerText||"").indexOf("Licenciado")>=0, $("licStatus").innerText.slice(0,55));
      $("configModal").classList.remove("open");
      $("btnBaixar").click(); await espera(700);
      reg("Com licença, volta a pedir só a confirmação do cliente", $("gateModal").classList.contains("open"));
      $("gateModal").classList.remove("open");
    }catch(e){ reg("Bateria de licença",false,String(e.message||e)); }

    // limpa o armazenamento do quadro de teste
    try{ ["tinaCasos","tinaDraft","tinaObjetos","tinaCfg","tinaBackup","tinaLic","tinaIni"].forEach(function(k){ W.localStorage.removeItem(k); }); }catch(e){}
    fim();
  }

  function fim(){
    document.getElementById("btnRodar").disabled=false;
    var f=linhas.filter(function(l){return l.ok===false;}).length;
    document.getElementById("tempo").textContent="concluído em "+((Date.now()-t0)/1000).toFixed(1)+"s"+(f?" — há falhas":" — tudo certo");
    document.title=(f? "✗ "+f+" falha(s)" : "✓ testes ok")+" — Atos Societários";
  }

  document.getElementById("btnRodar").addEventListener("click",rodar);
})();
</script>
</body>
</html>
